name: TOTAG Kitchen verification

on:
  push:
    branches:
      - feat/totag-kitchen-ordering-operations
  pull_request:
    paths:
      - 'client/src/pages/catering/**'
      - 'client/src/pages/catering.tsx'
      - 'client/src/App.tsx'
      - 'shared/kitchenCatalog.ts'
      - 'server/kitchenRoutes.ts'
      - 'server/cateringRoutes.ts'
      - 'server/index.ts'
      - 'server/routes.ts'

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: Verify Kitchen published prices
        run: npx tsx --test tests/kitchen-catalog.test.ts
      - name: TypeScript typecheck (includes pre-existing platform errors)
        run: npm run check
      - name: Production build (independent of legacy typing errors)
        if: always() && steps.install.outcome == 'success'
        run: npm run build
