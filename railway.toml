[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/api/services"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
PORT = { default = "3000" }

[[services]]
name = "totag-platform"

[services.source]
repo = "your-repo-url"
branch = "main"

[[services.domains]]
domain = "totaggroup.com"